name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19.0', '24']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --no-audit --no-fund
      - run: npm run verify:upstream
      - run: npm run verify:upstream:git
      - run: npm run typecheck
      - run: npm test
      - run: git diff --exit-code -- lib
  upstream-proxy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Fetch pinned upstream proxy
        run: |
          curl -fL --retry 3 https://github.com/JuliusBrussee/caveman/releases/download/bin-v4.1.0/caveman-proxy_linux_amd64 -o "$RUNNER_TEMP/caveman-proxy"
          echo "393b4e9b58f52eddcf77a24d32fd98aa0be011f8cff77498cf7ef55d9901195c  $RUNNER_TEMP/caveman-proxy" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/caveman-proxy"
          curl -fL --retry 3 https://github.com/JuliusBrussee/caveman/releases/download/bin-v4.1.0/caveman-blocks_linux_amd64 -o "$RUNNER_TEMP/caveman-blocks"
          echo "edb917309d776e5b12aa009334049da1ca8ea4de33679490df284e6f7682a006  $RUNNER_TEMP/caveman-blocks" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/caveman-blocks"
          curl -fL --retry 3 https://github.com/JuliusBrussee/caveman/releases/download/bin-v4.1.0/caveman-browse_linux_amd64 -o "$RUNNER_TEMP/caveman-browse"
          echo "ef3f72384536a65589badd15ba3f8b2f901c4d48af99eac80c4d1c7569729dd9  $RUNNER_TEMP/caveman-browse" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/caveman-browse"
      - run: node --test tests/auto.integration.test.mjs tests/compression.integration.test.mjs tests/blocks.integration.test.mjs tests/browse.integration.test.mjs
        env:
          CAVEMAN_PROXY_BINARY: ${{ runner.temp }}/caveman-proxy
          CAVEMAN_BLOCKS_BINARY: ${{ runner.temp }}/caveman-blocks
          CAVEMAN_BROWSE_BINARY: ${{ runner.temp }}/caveman-browse
          CAVEMAN_BROWSE_CHROME: /usr/bin/google-chrome
